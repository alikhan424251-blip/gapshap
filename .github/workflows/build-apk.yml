name: Build GapShap APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Android project files
        run: |
          # Back up our Dart code, pubspec and custom app icons
          # (flutter create would overwrite them)
          cp -r lib /tmp/backup_lib
          cp pubspec.yaml /tmp/backup_pubspec.yaml
          cp -r android/app/src/main/res /tmp/backup_res
          # Generate proper Android scaffold with the real Flutter SDK.
          # Package name must stay com.gapshap.app (matches Firebase).
          # Delete the incompatible hand-written android/ folder first:
          # flutter create never overwrites existing files.
          rm -rf android
          flutter create . --org com.gapshap --project-name app --platforms=android
          # Restore our code, pubspec and icons
          rm -rf lib && cp -r /tmp/backup_lib lib
          cp /tmp/backup_pubspec.yaml pubspec.yaml
          rm -rf android/app/src/main/res && cp -r /tmp/backup_res android/app/src/main/res
          # Bump compileSdk to 36 (required by firebase/androidx libs).
          # Done with sed (not python) so no indentation pitfalls.
          f=android/app/build.gradle.kts
          [ -f "$f" ] || f=android/app/build.gradle
          sed -i -E 's/compileSdk *=.*/compileSdk = 36/; s/compileSdkVersion .*/compileSdkVersion 36/' "$f"
          grep -n "compileSdk" "$f"
          # Set app display name and add internet permission (needed for Firebase)
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('android:label="app"', 'android:label="GapShap"')
          if 'android.permission.INTERNET' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          open(p, 'w').write(s)
          print('manifest patched')
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugin compileSdk to 36
        run: |
          find "$HOME/.pub-cache/hosted" -name build.gradle -exec sed -i 's/flutter.compileSdkVersion/36/g; s/compileSdkVersion 3[0-9]/compileSdkVersion 36/g; s/compileSdk 3[0-9]/compileSdk 36/g' {} +
          echo "--- firebase_auth compileSdk now: ---"
          grep -h "compileSdk" "$HOME/.pub-cache/hosted/pub.dev/firebase_auth-"*/android/build.gradle

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gapshap-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
