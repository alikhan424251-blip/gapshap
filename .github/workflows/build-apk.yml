name: Build GapShap APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Android project files
        run: |
          cp -r lib /tmp/backup_lib
          cp pubspec.yaml /tmp/backup_pubspec.yaml
          cp -r android/app/src/main/res /tmp/backup_res
          rm -rf android
          flutter create . --org com.gapshap --project-name app --platforms=android
          rm -rf lib && cp -r /tmp/backup_lib lib
          cp /tmp/backup_pubspec.yaml pubspec.yaml
          rm -rf android/app/src/main/res && cp -r /tmp/backup_res android/app/src/main/res
          python3 - <<'EOF'
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('android:label="app"', 'android:label="GapShap"')
          if 'android.permission.INTERNET' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          open(p, 'w').write(s)
          print('manifest patched')
          for p2 in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(p2):
                  s2 = open(p2).read()
                  s2 = s2.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
                  s2 = s2.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
                  open(p2, 'w').write(s2)
                  print('patched', p2)
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gapshap-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
